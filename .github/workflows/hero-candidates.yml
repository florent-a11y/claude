name: Fetch hero photo candidates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fetch_hero_candidates.py
      - run: |
          git config user.name "hero-fetch"
          git config user.email "hero-fetch@users.noreply.github.com"
          git checkout -B hero-candidates
          git add -f hero-candidates
          git commit -m "Hero photo candidates from Wikimedia Commons (temporary branch)"
          git push -f origin hero-candidates
